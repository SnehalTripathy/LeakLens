name: LeakLens CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r backend/requirements.txt
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - run: pytest backend/tests
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        name: Frontend dependency audit
        run: npm audit
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  browser-release:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install
      - name: Fetch axe-core accessibility rules
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.min.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and browser test dependencies
        run: |
          python -m pip install -r backend/requirements.txt playwright==1.56.0
      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Run browser workflow, accessibility and performance smoke checks
        env:
          AXE_CORE_PATH: /tmp/axe.min.js
        run: python scripts/release_smoke.py
