name: LeakLens CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid spending CI capacity on stale commits when several changes are pushed in sequence.
concurrency:
  group: leaklens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - run: pytest backend/tests
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        name: Frontend dependency audit
        run: npm audit
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  browser-release:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Fetch axe-core accessibility rules
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.min.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and browser test dependencies
        run: python -m pip install -r backend/requirements.txt playwright==1.56.0
      - name: Run browser workflow, accessibility and performance smoke checks
        env:
          AXE_CORE_PATH: /tmp/axe.min.js
        run: python scripts/release_smoke.py
