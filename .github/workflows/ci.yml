name: LeakLens CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        name: Dependency audit (report only)
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name, v.severity, 'fixAvailable='+JSON.stringify(v.fixAvailable)); console.log('Totals:', JSON.stringify(a.metadata?.vulnerabilities||{}));"
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
